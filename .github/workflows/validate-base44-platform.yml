name: Validate base44-platform skills

# The `skills/base44-platform-*` tree is compiled from the Base44 builder prompt
# and synced here nightly. This check proves a PR carries exactly what the compiler emitted:
# headers, manifest hashes, frontmatter, links and the SOURCE_COMMIT pin. Make it a required check
# on main, so the auto-merge workflow only merges a tree that passed it.

on:
  pull_request:
    paths:
      - "skills/base44-platform-*/**"
      - "SOURCE_COMMIT"
      - "scripts/validate-base44-platform.mjs"
      - ".github/workflows/validate-base44-platform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/validate-base44-platform.mjs
